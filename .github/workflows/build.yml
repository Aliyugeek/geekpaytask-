name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup our code
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/ 2>/dev/null || true
          cp pubspec.yaml /tmp/backup/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Flutter project (without deleting our code)
        run: |
          flutter create . --org com.geek --project-name paytask --overwrite
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/backup/lib/* lib/ 2>/dev/null || true
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml 2>/dev/null || true
          ls -la lib/

      - name: Restore Firebase
        run: |
          mkdir -p android/app
          cp android/app/google-services.json android/app/google-services.json 2>/dev/null || true
          # if file was in root from upload
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          cat android/app/google-services.json | head -n 5

      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk geekpaytask-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: geekpaytask-app.apk
 
