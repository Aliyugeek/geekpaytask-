name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix project
        run: |
          cat > pubspec.yaml <<'EOF'
          name: geekpaytask
          description: A new Flutter project.
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.5.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
          EOF
          rm -rf android
          flutter create --platforms=android --project-name geekpaytask /tmp/newapp
          cp -r /tmp/newapp/android ./
          mkdir -p lib
          if [ ! -f lib/main.dart ]; then
            echo "import 'package:flutter/material.dart'; void main(){runApp(MaterialApp(home:Scaffold(body:Center(child:Text('GeekPay')))));}" > lib/main.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/geekpaytask.apk
      - uses: actions/upload-artifact@v4
        with:
          name: geekpaytask
          path: build/app/outputs/flutter-apk/geekpaytask.apk
