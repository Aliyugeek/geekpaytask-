name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix lib if missing
        run: |
          if [ ! -f lib/main.dart ]; then
            mkdir -p lib
            echo "import 'package:flutter/material.dart'; void main(){runApp(MaterialApp(home:Scaffold(body:Center(child:Text('GeekPay')))));}" > lib/main.dart
          fi
      - name: Regenerate android folder
        run: |
          rm -rf android
          flutter create --platforms=android --project-name geekpaytask /tmp/newapp
          cp -r /tmp/newapp/android ./
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/geekpaytask.apk
      - uses: actions/upload-artifact@v4
        with:
          name: geekpaytask
          path: build/app/outputs/flutter-apk/geekpaytask.apk
