 workflows:
  android-workflow:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Create android folder if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.geekpay
          fi
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
