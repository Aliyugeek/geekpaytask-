
name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: rm -rf android
      - run: flutter create . --platforms=android
      - name: Fix pubspec.yaml SDK
        run: |
          cat pubspec.yaml
          python3 -c "
          import pathlib
          p = pathlib.Path('pubspec.yaml').read_text()
          if \"sdk:\" not in p:
              p = p.replace('environment:', \"environment:\n  sdk: '^3.5.0'\")
          else:
              import re
              p = re.sub(r'environment:\s*\n\s*sdk:.*', \"environment:\n  sdk: '^3.5.0'\", p)
          pathlib.Path('pubspec.yaml').write_text(p)
          print(p)
          "
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
