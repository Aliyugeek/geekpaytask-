<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--primary-green:#00ff88}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.app-container{max-width:400px;margin:0 auto;background:#000;min-height:100vh}
.screen{display:none;min-height:100vh;padding-bottom:80px}
.screen.active{display:block}
.logo-area{text-align:center;padding:60px 20px 30px}
.logo-icon{font-size:60px;color:var(--primary-green)}
.input-group{margin:15px}
.input-group input{width:100%;padding:15px;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff}
.btn-main{background:var(--primary-green);color:#000;border:none;width:90%;margin:15px;padding:15px;border-radius:10px;font-weight:bold;font-size:16px}
.app-header{display:flex;justify-content:space-between;padding:15px;background:#1e1e1e}
.admob-banner{width:100%;background:#111;text-align:center;min-height:60px;border:1px solid #222}
.account-number{font-size:24px;font-weight:bold;color:#fff;margin:10px 0}
.account-name{color:var(--primary-green);margin-bottom:20px}
.feed-video-container{position:relative;height:70vh}
.feed-video-placeholder{width:100%;height:100%;object-fit:cover}
</style>
<script>
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_API_KEY",
  authDomain: "geek-paytask.firebaseapp.com",
  projectId: "geek-paytask",
  storageBucket: "geek-paytask.appspot.com",
  messagingSenderId: "REPLACE",
  appId: "REPLACE"
};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
}
window.onload=()=>{try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
</script>
</head>
<body>
<div class="app-container">
<div class="admob-banner">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7768520042626041" data-ad-slot="2368792747" data-ad-format="auto" data-full-width-responsive="true"></ins>
</div>
<div id="login-screen" class="screen active">
<div class="logo-area"><i class="fas fa-crown logo-icon"></i><h1>GEEK PAYTASK</h1></div>
<div class="input-group"><input type="email" value="aliyugeek5@gmail.com"></div>
<div class="input-group"><input type="password" value="password"></div>
<button class="btn-main" onclick="showScreen('home-screen')">Login →</button>
</div>
<div id="home-screen" class="screen">
<div class="app-header"><i class="fas fa-plus-circle"></i><span>For You</span><i class="fas fa-search"></i></div>
<div class="feed-video-container">
<img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=800" class="feed-video-placeholder">
</div>
</div>
</div>
